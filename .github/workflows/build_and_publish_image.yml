name: Publish image to Docker Hub

on:
  workflow_dispatch: 

jobs:
  build_and_publish_image:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build
        run: |
          docker build . -t pcb1962/alpine-lighttpd-php:latest
      - name: publish
        run: |
          docker push pcb1962/alpine-lighttpd-php:latest 
